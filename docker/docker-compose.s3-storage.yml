# Docker Compose override for S3 storage backend
# Usage: docker compose -f docker-compose.yml -f docker-compose.s3-storage.yml up

# This configuration enables S3 storage backend for Edge Functions
# Make sure to set the required environment variables in your .env file:
# - EDGE_FUNCTIONS_S3_BUCKET_NAME
# - EDGE_FUNCTIONS_S3_REGION
# - AWS_ACCESS_KEY_ID
# - AWS_SECRET_ACCESS_KEY

name: supabase

services:
  functions:
    environment:
      # Override storage backend to use S3
      EDGE_FUNCTIONS_STORAGE_BACKEND: s3
      
      # S3 Configuration (these should be set in .env file)
      EDGE_FUNCTIONS_S3_BUCKET_NAME: ${EDGE_FUNCTIONS_S3_BUCKET_NAME}
      EDGE_FUNCTIONS_S3_REGION: ${EDGE_FUNCTIONS_S3_REGION}
      EDGE_FUNCTIONS_S3_ENDPOINT: ${EDGE_FUNCTIONS_S3_ENDPOINT:-}
      
      # AWS Credentials
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      
      # Additional S3 configuration
      AWS_DEFAULT_REGION: ${EDGE_FUNCTIONS_S3_REGION}
      
      # Deno permissions for S3 access
      DENO_ALLOW_NET: "true"
      DENO_ALLOW_ENV: "SUPABASE_URL,SUPABASE_ANON_KEY,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_DEFAULT_REGION"
    
    # Remove local volume mount when using S3 storage
    volumes: []

  studio:
    environment:
      # Studio configuration for S3 storage
      EDGE_FUNCTIONS_STORAGE_BACKEND: s3
      EDGE_FUNCTIONS_S3_BUCKET_NAME: ${EDGE_FUNCTIONS_S3_BUCKET_NAME}
      EDGE_FUNCTIONS_S3_REGION: ${EDGE_FUNCTIONS_S3_REGION}
      EDGE_FUNCTIONS_S3_ENDPOINT: ${EDGE_FUNCTIONS_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}