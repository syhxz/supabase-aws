# Kubernetes Deployment for Enhanced Supabase REST API
# Requirements: 13.1, 13.2, 13.3, 13.4, 13.5

apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-rest-enhanced
  namespace: supabase
  labels:
    app: supabase-rest
    component: api
    version: enhanced
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: supabase-rest
      component: api
  template:
    metadata:
      labels:
        app: supabase-rest
        component: api
        version: enhanced
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: postgrest
        image: supabase-rest-enhanced:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        # Core PostgREST configuration
        - name: PGRST_DB_URI
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: database-uri
        - name: PGRST_DB_SCHEMAS
          valueFrom:
            configMapKeyRef:
              name: supabase-config
              key: db-schemas
        - name: PGRST_DB_ANON_ROLE
          value: "anon"
        - name: PGRST_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: jwt-secret
        - name: PGRST_JWT_AUD
          value: "authenticated"
        - name: PGRST_DB_USE_LEGACY_GUCS
          value: "false"
        
        # Performance optimization settings
        - name: PGRST_DB_MAX_ROWS
          value: "2000"
        - name: PGRST_DB_POOL
          value: "20"
        - name: PGRST_DB_POOL_TIMEOUT
          value: "15"
        - name: PGRST_DB_POOL_ACQUISITION_TIMEOUT
          value: "15"
        - name: PGRST_SERVER_HOST
          value: "0.0.0.0"
        - name: PGRST_SERVER_PORT
          value: "3000"
        - name: PGRST_DB_PREPARED_STATEMENTS
          value: "true"
        - name: PGRST_DB_CONFIG
          value: "true"
        - name: PGRST_DB_ROOT_SPEC
          value: "true"
        - name: PGRST_LOG_LEVEL
          value: "warn"
        - name: PGRST_SERVER_TRACE_HEADER
          value: "X-Request-ID"
        - name: PGRST_DB_SCHEMA_CACHE_SIZE
          value: "200"
        
        # Enhanced features
        - name: ENHANCED_RPC_ENABLED
          value: "true"
        - name: ENHANCED_JSON_OPS_ENABLED
          value: "true"
        - name: ENHANCED_FTS_ENABLED
          value: "true"
        - name: ENHANCED_AGGREGATES_ENABLED
          value: "true"
        - name: ENHANCED_BULK_OPS_ENABLED
          value: "true"
        - name: ENHANCED_TRANSACTIONS_ENABLED
          value: "true"
        - name: ENHANCED_ARRAY_OPS_ENABLED
          value: "true"
        
        # Cache configuration
        - name: ENHANCED_RESPONSE_CACHE_ENABLED
          value: "true"
        - name: ENHANCED_RESPONSE_CACHE_TTL
          value: "600"
        
        # Query complexity limits
        - name: ENHANCED_MAX_QUERY_COMPLEXITY
          value: "2000"
        - name: ENHANCED_MAX_NESTED_DEPTH
          value: "7"
        - name: ENHANCED_MAX_BULK_SIZE
          value: "2000"
        
        # Monitoring
        - name: ENHANCED_METRICS_ENABLED
          value: "true"
        - name: ENHANCED_METRICS_PORT
          value: "9090"
        - name: ENHANCED_METRICS_INTERVAL
          value: "60"
        - name: ENHANCED_HEALTH_CHECK_ENABLED
          value: "true"
        - name: ENHANCED_MEMORY_LIMIT_MB
          value: "1024"
        - name: ENHANCED_MIN_DISK_SPACE_MB
          value: "200"
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "1000m"
          limits:
            memory: "1Gi"
            cpu: "2000m"
        
        livenessProbe:
          exec:
            command:
            - /usr/local/bin/health-check.sh
            - --simple
          initialDelaySeconds: 180
          periodSeconds: 60
          timeoutSeconds: 15
          successThreshold: 1
          failureThreshold: 5
        
        readinessProbe:
          exec:
            command:
            - /usr/local/bin/health-check.sh
            - --simple
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        
        startupProbe:
          exec:
            command:
            - /usr/local/bin/health-check.sh
            - --simple
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 18
        
        volumeMounts:
        - name: rest-cache
          mountPath: /tmp/postgrest-cache
        - name: rest-logs
          mountPath: /var/log/postgrest
        
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      
      volumes:
      - name: rest-cache
        emptyDir:
          sizeLimit: 1Gi
      - name: rest-logs
        emptyDir:
          sizeLimit: 500Mi
      
      securityContext:
        fsGroup: 1000
      
      terminationGracePeriodSeconds: 60
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - supabase-rest
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: supabase-rest-service
  namespace: supabase
  labels:
    app: supabase-rest
    component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: supabase-rest
    component: api

---
apiVersion: v1
kind: Service
metadata:
  name: supabase-rest-headless
  namespace: supabase
  labels:
    app: supabase-rest
    component: api
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app: supabase-rest
    component: api

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: supabase-rest-pdb
  namespace: supabase
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: supabase-rest
      component: api

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: supabase-rest-hpa
  namespace: supabase
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: supabase-rest-enhanced
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60